# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# `go` is in here deliberately, unlike the sibling providers — this one handles
# a workspace-scoped API key, so it is worth scanning. The body switches Go to
# autobuild on its own; CodeQL rejects build-mode none for it.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '34 23 * * 0'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: kirchDev/workflows/.github/workflows/_codeql.yml@17381dcb03641c3e720449c345afeefa1365a329 # v0.17.0
    with:
      languages: '["actions", "go", "javascript-typescript"]'
